<svg xmlns="http://www.w3.org/2000/svg" id="pzxLogoSvg" viewBox="0 0 900 650" class="w-full h-auto drop-shadow-2xl">
                    <defs>
                        <!-- Silver Metallic Gradient for PZ -->
                        <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ffffff"/>
                            <stop offset="35%" stop-color="#e2e8f0"/>
                            <stop offset="65%" stop-color="#94a3b8"/>
                            <stop offset="100%" stop-color="#cbd5e1"/>
                        </linearGradient>

                        <!-- Glowing Cyan/Blue Gradient -->
                        <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00ffff"/>
                            <stop offset="50%" stop-color="#00d2ff"/>
                            <stop offset="100%" stop-color="#0055ff"/>
                        </linearGradient>

                        <!-- Outer Rings Gradient -->
                        <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#475569"/>
                            <stop offset="50%" stop-color="#00f0ff"/>
                            <stop offset="100%" stop-color="#1e3a8a"/>
                        </linearGradient>

                        <!-- Glow Filter -->
                        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>

                        <!-- Inner Shadow for 3D effect -->
                        <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
                            <feDropShadow dx="2" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
                        </filter>
                    </defs>

                    <!-- Background Dark Grid / Vignette Effect -->
                    <radialGradient id="bgVignette" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#0f172a" stop-opacity="1"/>
                        <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
                    </radialGradient>
                    <rect width="900" height="650" fill="url(#bgVignette)" rx="24"/>

                    <!-- Outer Concentric Rings -->
                    <circle cx="450" cy="275" r="230" fill="none" stroke="url(#ringGradient)" stroke-width="4" opacity="0.6"/>
                    <circle cx="450" cy="275" r="215" fill="none" stroke="url(#ringGradient)" stroke-width="12" stroke-dasharray="1150 220" class="ring" filter="url(#glow)"/>
                    <circle cx="450" cy="275" r="195" fill="none" stroke="url(#ringGradient)" stroke-width="2" opacity="0.4" stroke-dasharray="20 10"/>

                    <!-- Main Text: PZ -->
                    <g filter="url(#dropShadow)">
                        <text x="135" y="340" font-family="Inter, sans-serif" font-size="175" font-weight="900" fill="url(#silver)" stroke="#090d16" stroke-width="4" letter-spacing="-8px">PZ</text>
                    </g>

                    <!-- Glowing X -->
                    <g filter="url(#glow)">
                        <text x="515" y="340" font-family="Inter, sans-serif" font-size="175" font-weight="900" fill="url(#blue)" stroke="#020617" stroke-width="3" letter-spacing="-8px">X</text>
                    </g>

                    <!-- Dynamic Diagonal Energy Slash -->
                    <polygon class="slash" points="245,430 520,165 550,175 275,445" fill="url(#blue)" filter="url(#glow)"/>
                    <!-- Slash highlight core -->
                    <polygon points="255,425 515,168 525,172 265,435" fill="#ffffff" opacity="0.8"/>

                    <!-- Subtitle: DYNAMIC PRECISION -->
                    <text x="450" y="445" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#94a3b8" letter-spacing="10px" text-anchor="middle">DYNAMIC PRECISION</text>
                </svg>
